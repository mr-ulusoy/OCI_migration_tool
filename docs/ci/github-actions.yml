name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Shell syntax
        run: bash -n install.sh scripts/*.sh

      - name: Python compile
        run: python -m py_compile backend/main.py backend/worker.py backend/run_backups.py

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev
          npm run build
